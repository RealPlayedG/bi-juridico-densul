<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BI Jurídico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ versao }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tema.css') }}?v={{ versao }}">
  <script>/* Tema claro por padrão; escuro só se a pessoa escolher no botão */ var t = 'light'; try { t = localStorage.getItem('bj-theme') || 'light' } catch (e) {} document.documentElement.dataset.theme = t</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">BJ</div><div><b>BI Jurídico</b><small>Densul</small></div></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <div class="m-brand"><div class="mark">BJ</div>BI Jurídico</div>
      <label class="loja-sel" id="lojaSel"></label>
      <div class="top-right">
        <span id="sync"></span>
        <div class="seg" id="profile"></div>
        <div class="bell-wrap" id="bell"></div>
        <button class="iconbtn" id="themeBtn" aria-label="Alternar tema claro e escuro"></button>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<div id="layer"></div>
<script>window.ME = {{ me | tojson }};</script>
<script src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}?v={{ versao }}"></script>
</body>
</html>
